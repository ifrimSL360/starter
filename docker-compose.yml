name: refund-interview

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commands
      POSTGRES_USER: commands
      POSTGRES_PASSWORD: commands
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commands -d commands"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
